[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evaluation-driven-prompt-learning"
version = "0.1.0"
description = "Reproducible evaluation-driven prompt optimization"
requires-python = ">=3.12"
dependencies = [
  "datasets>=2.19.0",
  "openai>=1.30.0",
  "pandas>=2.0.0",
  "python-dotenv>=1.0.0",
  "arize-phoenix-evals==2.7.0",
  "prompt-learning-enhanced @ git+https://github.com/Arize-ai/prompt-learning.git",
  "PyYAML>=6.0",
  "scikit-learn>=1.4",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=9.1"]

[project.scripts]
prompt-learning = "prompt_learning.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
